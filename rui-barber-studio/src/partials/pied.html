<footer class="pied">
  <div class="enveloppe pied__grille">
    <p class="pied__logo">{{logo:32}}</p>
    <p>{{textes.pied_cookies}}</p>
    <details class="pied__mentions">
      <summary>{{textes.pied_mentions}}</summary>
      <p>{{mentions}}</p>
    </details>
    <p class="pied__credit"><a href="{{site.credit.url}}" rel="noopener">{{site.credit.texte}} ({{site.credit.affichage}})</a></p>
  </div>
  <div class="ruban ruban--page ruban--bas" aria-hidden="true"></div>
</footer>
